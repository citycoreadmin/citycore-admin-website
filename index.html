<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="google-site-verification" content="n--XszD1D0eT2RAv5fXx8zQ-PGSljuWTeq1ZpitfzKU" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CityCore Admin | Help Center &amp; Support</title>
  <meta name="description" content="Official CityCore Admin help center and support. Search articles or message our support team.">
  <link rel="canonical" href="https://citycoreadmin.com/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="CityCore Admin">
  <meta property="og:title" content="CityCore Admin | Help Center &amp; Support">
  <meta property="og:description" content="Official CityCore Admin help center and support. Search articles or message our support team.">
  <meta property="og:url" content="https://citycoreadmin.com/">
  <meta property="og:image" content="https://citycoreadmin.com/citycore-logo.png">
  <meta name="twitter:card" content="summary">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" type="image/png" href="citycore-logo.png">
  <link rel="stylesheet" href="css/styles.css">
  <script>try{var s=localStorage.getItem("cc_theme");document.documentElement.dataset.theme=s||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}catch(e){}</script>
  <script src="js/config.js"></script>
  <script>if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) document.write('<script src="js/config.local.js"><\/script>');</script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<header class="site-header">
  <nav class="nav">
    <a class="brand" href="./"><img src="citycore-logo.png" alt=""><span>CityCore Admin</span></a>
    <div class="nav-links">
      <a href="#home" data-i18n="nav_home">Home</a>
      <a href="#help" data-i18n="nav_help">Help Center</a>
      <a href="#contact" data-i18n="nav_support">Support</a>
      <a href="staff.html" data-i18n="nav_staff">Staff</a>
    </div>
    <div class="nav-tools">
      <label class="sr-only" for="langSel" data-i18n="language">Language</label>
      <select id="langSel" class="select" data-lang-select></select>
      <button class="icon-btn" data-theme-toggle data-i18n-aria="theme" aria-label="Toggle theme">◐</button>
    </div>
  </nav>
</header>

<section class="hero" id="home">
  <div class="hero-inner">
    <img class="hero-logo" src="citycore-logo.png" alt="CityCore Admin">
    <h1 data-i18n="hero_title">Hi, how can we help you?</h1>
    <form class="search" id="searchForm" role="search">
      <span class="search-icon" aria-hidden="true">⌕</span>
      <input id="searchInput" type="search" autocomplete="off" data-i18n-ph="search_ph" placeholder="Search for articles" aria-label="Search for articles">
      <button type="submit" class="btn btn-primary" data-i18n="search_btn">Search</button>
    </form>
    <div class="platform-row">
      <label for="platformSel" data-i18n="platform">Platform</label>
      <select id="platformSel" class="select"></select>
    </div>
  </div>
</section>

<main id="main">
  <section class="wrap" id="help">
    <div id="catView">
      <h2 data-i18n="help_cats">Browse by category</h2>
      <div class="cat-grid" id="catGrid"></div>
    </div>
    <div id="listView" hidden>
      <button class="btn btn-ghost btn-sm" id="listBack" data-i18n="back">Back</button>
      <h2 id="listTitle"></h2>
      <div class="art-grid" id="artGrid"></div>
      <p class="muted" id="noResults" hidden data-i18n="no_results"></p>
    </div>
  </section>

  <section class="wrap cta" id="contact">
    <h2 data-i18n="contact_cta">Still need help? Message our support team.</h2>
    <button class="btn btn-primary btn-lg" id="ctaBtn" data-i18n="contact_btn">Contact support</button>
  </section>
</main>

<footer class="site-footer">
  <span data-i18n="footer">© 2026 CityCore Admin. All rights reserved.</span>
  <a href="privacy.html" data-i18n="privacy">Privacy Policy</a>
</footer>

<dialog id="artDialog" class="dialog" aria-labelledby="artTitle">
  <div class="dialog-head"><h2 id="artTitle"></h2><button class="icon-btn" id="artClose" aria-label="Close">✕</button></div>
  <img id="artImg" alt="" class="dialog-img" hidden>
  <ol id="artSteps" class="steps"></ol>
</dialog>

<script type="module" src="js/home.js"></script>
</body>
</html>
